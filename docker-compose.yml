services:
  db:
    image: postgres:16
    container_name: magaza-db
    environment:
      POSTGRES_USER: magaza
      POSTGRES_PASSWORD: magaza123
      POSTGRES_DB: magaza
    ports:
      - "5437:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Üretim imajını yerelde denemek için (geliştirmede dotnet watch kullanılır)
  api:
    build: ./backend
    container_name: magaza-api
    depends_on:
      - db
    environment:
      # Konteynerler kendi ağlarında SERVİS ADIYLA konuşur: db:5432
      ConnectionStrings__Default: "Host=db;Port=5432;Database=magaza;Username=magaza;Password=magaza123"
      Cors__Origins: "http://localhost:3000"
      Auth__Password: "magaza-gelistirme"
      PORT: "8080"
    ports:
      - "8080:8080"

volumes:
  pgdata:
